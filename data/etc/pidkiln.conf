#
## Preferences for PIDKiln system
#

#
# WiFi/Network preferences
#
# WiFi client mode
# SSID and password for AP to which PIDKiln should try to connect
WiFi_SSID = 
WiFi_Password = 

# how many times PIDKiln tries to connect to the WiFi AP (about 1.5 s per try). 0 - try forever
WiFi_Retry_cnt = 9

# In what WiFi mode PIDKiln should operate
# 0 = no WiFi; 1 = connect to AP - if failed, be AP (default); 2 = connect only to AP; 3 - be only AP
WiFi_Mode = 1

# Access point PIDKiln creates itself (modes 1 and 3) - its address is 192.168.10.1
# The password needs 8-63 characters, otherwise the default (hotashell) is used. Change it.
WiFi_AP_Name = PIDKiln_AP
WiFi_AP_Pass = hotashell

#
# HTTP server configuration
#
# Should the large JS script be download from Internet (0) or be send from local http server (1)
# This file sets 1 (without a config file the default is 0). If possible use Internet - sending the large files from the ESP32 is slow
HTTP_Local_JS = 1

#
# Web authentication (HTTP Basic auth over plain HTTP - keep PIDKiln on a network you trust)
# hotashell is the factory password - change it. The preferences page warns while it is in use.
#
Auth_Username = admin
Auth_Password = hotashell

#
# Time and NTP setup
#
# NTP servers to synchronize time if Internet connection is available
NTP_Server1 = 0.pl.pool.ntp.org
NTP_Server2 = 1.pl.pool.ntp.org
NTP_Server3 = 2.pl.pool.ntp.org

# Time offset (+/-) comparing to GMT time and daylight change if exists
GMT_Offset_sec = 3600
Daylight_Offset_sec = 3600

# If you don't have Internet connection to use NTP, this time will be set always after PIDKiln start
Initial_date = 2022-05-30
Initial_time = 11:00:00

#
# PID Configuration
#
# PID Window size in ms - this is PID cycle
PID_Window = 5000

# Initial PID parameters 0-255 float
PID_Kp = 20
PID_Ki = 0.2
PID_Kd = 0.1

# How big difference between SET and CURRENT temperature we can tolerate, if modulo is bigger - go to dwell (wait until it's reached)
# Warning! if this temperature never is reached it will stop the program. Default -1 = do not wait.
PID_Temp_Threshold = -1

#
# Logging configuration
#
# How often should we log running program (and housing - if present) temperature to CSV file (in seconds), 0 - disable logging
LOG_Window = 30
# How many log files we should keep on drive. 0=unlimited (try to make this number even). PIDKiln will delete oldest files, but since SPIFFS does not
# have file dates, it will be done based on filename, by default filenames start with date. Remember that every program run produces 2 files.
LOG_Files_Limit = 40
# Define if we should have some logging/debug over serial port and/or Syslog
DBG_Serial = 1
DBG_Syslog = 0
# If you use Syslog - provide host IP and syslog PORT
DBG_Syslog_Srv = 192.168.1.2
DBG_Syslog_Port = 514

#
# Safety parameters
#
# If the kiln reads below MIN temperature while a program runs - assume a sensor error and abort. Can be negative (unheated workshop).
# MAX and housing limits are checked every second, also without a program: then PIDKiln switches the relays off and raises the alarm.
MIN_Temperature = 10

# If registered MAX or above - assume error and abort, do not allow to register higher temperatures in program definition
MAX_Temperature = 1350

# If housing temperature C is above this - abort
MAX_Housing_Temperature = 130

# How long (in minutes) controller will try to heat up kiln without increase in temperature before aborting.
# This should detect a failed heating element or relay, or a thermocouple that is no longer in the kiln
# (with several elements, one failed element may not be caught).
# It's disabled (0) by default, because it's very depending on your hw configuration and there is no good value for everyone.
# This works like this. While a program is active and the set temperature is 5+C above the current temperature (5C because of
# possible measurement errors) - in any step, also dwell - PIDKiln counts the Thermal_Runaway window. If the temperature
# does not go up by 5C within the window, the program aborts (error 16). Every 5C gained starts a new window.
# Keep in mind that PID algorithm may react slowly - so this value should be quite big (and also depends of your heating element power).
#
# Independent of this setting, PIDKiln watches for a stuck (welded) SSR: if the kiln warms up by 25C while the SSR has been
# switched off the whole time, it aborts the program (error 17), which also opens the EMR. Without a running program it can
# only switch the alarm on (see Alarm_Timeout) and log the error - only the EMR can cut the power of a stuck SSR.
Thermal_Runaway = 0

# How long (seconds) should we keep ALARM_PIN high after program abort (something wrong has happen) - 0 = alarm disabled.
Alarm_Timeout = 5

# How many thermocouple A and B errors combined, we can tolerate without aborting program.
# If you have sporadic thermocouple read errors, you can increase this value. 
MAX31855_Error_Grace_Count = 5
